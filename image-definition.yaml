---
name: ubuntu-server-riscv64-preinstalled-revyos
display-name: Ubuntu Server RISC-V preinstalled by RevyOS/Ubuntu
revision: 1
architecture: riscv64
series: noble
class: preinstalled
kernel: linux-image-6.17.0-22-generic
gadget:
  url: "https://github.com/revyos/risc-v-gadget.git"
  type: "git"
  branch: "revyos"
rootfs:
  archive: ubuntu
  sources-list-deb822: true
  components:
    - main
    - restricted
    - universe
    - multiverse
  mirror: "https://ports.ubuntu.com/ubuntu-ports/"
  pocket: updates
  seed:
    urls:
      - "https://git.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/+git/"
    branch: noble
    names:
      - cloud-image
      - server
      - minimal
      - standard
customization:
  extra-packages:
    - name: "flash-kernel"
    - name: "grub-efi-riscv64"
    - name: "linux-firmware"
  extra-ppas:
    - name: "revyos/addons-uuu"
      fingerprint: "42AE1A61419449DDCD77C3C8857537A40279B844"
  extra-snaps:
    - name: snapd
  fstab:
    - label: "writable"
      mountpoint: "/"
      filesystem-type: "ext4"
      dump: false
      fsck-order: 1
    - label: "esp"
      mountpoint: "/boot/efi"
      filesystem-type: "vfat"
      mount-options: "defaults"
      dump: false
      fsck-order: 1
artifacts:
  img:
    - name: ubuntu-24.04-preinstalled-server-riscv64-revyos.img
  manifest:
    name: ubuntu-24.04-preinstalled-server-riscv64-revyos.manifest
